# APPLICATION
spring.application.name=market

# PROFILES
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# DATABASE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT KEYS
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

# JWT TOKEN EXPIRATION
app.security.jwt.access-token-expiration=86400000
app.security.jwt.refresh-token-expiration=604800000

# DISPOSABLE EMAIL DOMAINS
app.security.disposable-email=10minutemail,20minutemail,33mail,5ymail,anonbox,guerrillamail,mailinator,maildrop,mailnesia,moakt,my10minutemail,throwawaymail,trashmail,temp-mail,tempmail,truemail,yopmail

# EMAIL CONFIGURATION
app.email.frontend-url=${FRONTEND_URL}
app.email.password-reset-token-expiration-minutes=10

# BREVO CONFIGURATION
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}
brevo.url=${BREVO_URL}

# ADMINISTRATOR CONFIGURATION
app.initial-admin.email=${INITIAL_ADMIN_EMAIL}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD}
app.initial-admin.phone=${INITIAL_ADMIN_PHONE}

# GOOGLE OAUTH2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# GITHUB OAUTH2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# APPLICATION OAUTH2
app.frontend.oauth2-success-url=${FRONTEND_OAUTH2_SUCCESS_URL}
app.security.oauth2.login-code-expiration-seconds=60

# CORS
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,X-CSRF-TOKEN
app.security.cors.allow-credentials=true
app.security.cors.max-age=3600

# PASSWORD POLICY
security.password.expiration-minutes=129600

# SMS CONFIGURATION
msg91.base-url=https://control.msg91.com
msg91.auth-key=${MSG91_AUTH_KEY}
msg91.otp.template-id=${MSG91_OTP_TEMPLATE_ID}
msg91.otp.send-path=/api/v5/otp
msg91.otp.verify-path=/api/v5/otp/verify
msg91.otp.resend-path=/api/v5/otp/retry
msg91.otp.retry-type=text

# LOGIN ATTEMPT PROTECTION
security.login-attempt.max-attempts=5
security.login-attempt.lock-duration-minutes=15

# LOCATION CONFIGURATION
geocoding.geoapify.base-url=https://api.geoapify.com
geocoding.geoapify.api-key=${GEOAPIFY_API_KEY}
geocoding.geoapify.language=en
geocoding.geoapify.search-limit=5

# CLOUDINARY CONFIGURATION
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# WEATHER CONFIGURATION
weather.open-meteo.base-url=https://api.open-meteo.com/v1/forecast
weather.open-meteo.forecast-days=7
weather.open-meteo.connect-timeout-seconds=5
weather.open-meteo.read-timeout-seconds=10

# MARKET PRICE CONFIGURATION
market-price.primary-provider=mandi-price
market-price.mandi-price.base-url=https://mandi-api.onrender.com

# CROP INFO CONFIGURATION
crop-info.perenual.base-url=https://perenual.com/api/v2
crop-info.perenual.api-key=${PERENUAL_API_KEY}